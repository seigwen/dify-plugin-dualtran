          zh_Hans: "印度尼西亚语（id）"
          ja_JP: "インドネシア語（id）"
          pt_BR: "Indonésio (id)"
      - value: "it"
        label:
          en_US: "Italian (it)"
          zh_Hans: "意大利语（it）"
          ja_JP: "イタリア語（it）"
          pt_BR: "Italiano (it)"
      - value: "ja"
