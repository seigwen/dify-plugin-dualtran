identity:
  name: "dualtran"
  author: "seigwen"
  label:
    en_US: "DualTran Translate"
    zh_Hans: "DualTran 翻译"
    ja_JP: "DualTran Translate"
    pt_BR: "DualTran Translate"
description:
  human:
    en_US: "Translate text with Google or your own AI model (BYOK)."
    zh_Hans: "用 Google 或你自己的 AI 模型翻译文本（BYOK）。"
    ja_JP: "Google またはご自身の AI モデル（BYOK）でテキストを翻訳します。"
    pt_BR: "Traduza textos com o Google ou com seu próprio modelo de IA (BYOK)."
  llm: "Translate a text into a target language. Engines: Google (free) or the user's configured AI/DeepL provider (BYOK)."
parameters:
  - name: "text"
    type: "string"
    required: true
    label:
      en_US: "Text"
      zh_Hans: "文本"
      ja_JP: "テキスト"
      pt_BR: "Texto"
    human_description:
      en_US: "The text to translate."
      zh_Hans: "需要翻译的文本。"
      ja_JP: "翻訳するテキスト。"
      pt_BR: "O texto a ser traduzido."
    llm_description: "The text to translate."
    form: "llm"
  - name: "target_lang"
    type: "select"
    required: true
    default: "en"
    label:
      en_US: "Target language"
      zh_Hans: "目标语言"
      ja_JP: "翻訳先言語"
      pt_BR: "Idioma de destino"
    human_description:
      en_US: "Pick the language to translate into. The stored value is the language code."
      zh_Hans: "选择要翻译成的目标语言，保存的是语言代码。"
      ja_JP: "翻訳先の言語を選択します。保存される値は言語コードです。"
      pt_BR: "Escolha o idioma de destino. O valor salvo é o código do idioma."
    llm_description: "Target language code to translate into (en, zh-CN, ja, …)."
    form: "llm"
    options:
      - value: "af"
        label:
          en_US: "Afrikaans (af)"
          zh_Hans: "南非荷兰语（af）"
          ja_JP: "アフリカーンス語（af）"
          pt_BR: "Africâner (af)"
      - value: "ar"
        label:
          en_US: "Arabic (ar)"
          zh_Hans: "阿拉伯语（ar）"
          ja_JP: "アラビア語（ar）"
          pt_BR: "Árabe (ar)"
      - value: "bn"
        label:
          en_US: "Bengali (bn)"
          zh_Hans: "孟加拉语（bn）"
          ja_JP: "ベンガル語（bn）"
          pt_BR: "Bengali (bn)"
      - value: "bg"
        label:
          en_US: "Bulgarian (bg)"
          zh_Hans: "保加利亚语（bg）"
          ja_JP: "ブルガリア語（bg）"
          pt_BR: "Búlgaro (bg)"
      - value: "ca"
        label:
          en_US: "Catalan (ca)"
          zh_Hans: "加泰罗尼亚语（ca）"
          ja_JP: "カタルーニャ語（ca）"
          pt_BR: "Catalão (ca)"
      - value: "zh-CN"
        label:
          en_US: "Chinese (Simplified) (zh-CN)"
          zh_Hans: "中文（简体）（zh-CN）"
          ja_JP: "中国語（簡体字）（zh-CN）"
          pt_BR: "Chinês (Simplificado) (zh-CN)"
      - value: "zh-TW"
        label:
          en_US: "Chinese (Traditional) (zh-TW)"
          zh_Hans: "中文（繁体）（zh-TW）"
          ja_JP: "中国語（繁体字）（zh-TW）"
          pt_BR: "Chinês (Tradicional) (zh-TW)"
      - value: "hr"
        label:
          en_US: "Croatian (hr)"
          zh_Hans: "克罗地亚语（hr）"
          ja_JP: "クロアチア語（hr）"
          pt_BR: "Croata (hr)"
      - value: "cs"
        label:
          en_US: "Czech (cs)"
          zh_Hans: "捷克语（cs）"
          ja_JP: "チェコ語（cs）"
          pt_BR: "Tcheco (cs)"
      - value: "da"
        label:
          en_US: "Danish (da)"
          zh_Hans: "丹麦语（da）"
          ja_JP: "デンマーク語（da）"
          pt_BR: "Dinamarquês (da)"
      - value: "nl"
        label:
          en_US: "Dutch (nl)"
          zh_Hans: "荷兰语（nl）"
          ja_JP: "オランダ語（nl）"
          pt_BR: "Holandês (nl)"
      - value: "en"
        label:
          en_US: "English (en)"
          zh_Hans: "英语（en）"
          ja_JP: "英語（en）"
          pt_BR: "Inglês (en)"
      - value: "et"
