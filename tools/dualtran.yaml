          zh_Hans: "印地语（hi）"
          ja_JP: "ヒンディー語（hi）"
          pt_BR: "Hindi (hi)"
      - value: "hu"
        label:
          en_US: "Hungarian (hu)"
          zh_Hans: "匈牙利语（hu）"
