      - value: "fa"
        label:
          en_US: "Persian (fa)"
          zh_Hans: "波斯语（fa）"
          ja_JP: "ペルシア語（fa）"
          pt_BR: "Persa (fa)"
      - value: "pl"
        label:
          en_US: "Polish (pl)"
          zh_Hans: "波兰语（pl）"
          ja_JP: "ポーランド語（pl）"
          pt_BR: "Polonês (pl)"
      - value: "pt"
        label:
          en_US: "Portuguese (pt)"
          zh_Hans: "葡萄牙语（pt）"
          ja_JP: "ポルトガル語（pt）"
          pt_BR: "Português (pt)"
      - value: "pt-BR"
        label:
          en_US: "Portuguese (Brazil) (pt-BR)"
          zh_Hans: "葡萄牙语（巴西）（pt-BR）"
          ja_JP: "ポルトガル語（ブラジル）（pt-BR）"
          pt_BR: "Português (Brasil) (pt-BR)"
      - value: "ro"
        label:
          en_US: "Romanian (ro)"
          zh_Hans: "罗马尼亚语（ro）"
          ja_JP: "ルーマニア語（ro）"
          pt_BR: "Romeno (ro)"
      - value: "ru"
        label:
          en_US: "Russian (ru)"
          zh_Hans: "俄语（ru）"
          ja_JP: "ロシア語（ru）"
          pt_BR: "Russo (ru)"
      - value: "sr"
        label:
          en_US: "Serbian (sr)"
          zh_Hans: "塞尔维亚语（sr）"
          ja_JP: "セルビア語（sr）"
          pt_BR: "Sérvio (sr)"
      - value: "sk"
        label:
          en_US: "Slovak (sk)"
          zh_Hans: "斯洛伐克语（sk）"
          ja_JP: "スロバキア語（sk）"
          pt_BR: "Eslovaco (sk)"
      - value: "sl"
        label:
          en_US: "Slovenian (sl)"
          zh_Hans: "斯洛文尼亚语（sl）"
          ja_JP: "スロベニア語（sl）"
          pt_BR: "Esloveno (sl)"
      - value: "es"
        label:
          en_US: "Spanish (es)"
          zh_Hans: "西班牙语（es）"
          ja_JP: "スペイン語（es）"
          pt_BR: "Espanhol (es)"
      - value: "sv"
        label:
          en_US: "Swedish (sv)"
          zh_Hans: "瑞典语（sv）"
          ja_JP: "スウェーデン語（sv）"
          pt_BR: "Sueco (sv)"
      - value: "th"
        label:
          en_US: "Thai (th)"
          zh_Hans: "泰语（th）"
          ja_JP: "タイ語（th）"
          pt_BR: "Tailandês (th)"
      - value: "tr"
        label:
          en_US: "Turkish (tr)"
          zh_Hans: "土耳其语（tr）"
          ja_JP: "トルコ語（tr）"
          pt_BR: "Turco (tr)"
      - value: "uk"
        label:
          en_US: "Ukrainian (uk)"
          zh_Hans: "乌克兰语（uk）"
          ja_JP: "ウクライナ語（uk）"
          pt_BR: "Ucraniano (uk)"
      - value: "ur"
        label:
          en_US: "Urdu (ur)"
          zh_Hans: "乌尔都语（ur）"
          ja_JP: "ウルドゥー語（ur）"
          pt_BR: "Urdu (ur)"
      - value: "vi"
        label:
          en_US: "Vietnamese (vi)"
          zh_Hans: "越南语（vi）"
          ja_JP: "ベトナム語（vi）"
          pt_BR: "Vietnamita (vi)"
  - name: "source_lang"
    type: "string"
    required: false
    label:
      en_US: "Source language"
      zh_Hans: "源语言"
      ja_JP: "翻訳元言語"
      pt_BR: "Idioma de origem"
    human_description:
      en_US: "Language the text is written in; auto detects it."
      zh_Hans: "文本的源语言；auto 表示自动检测。"
      ja_JP: "テキストの言語。自動検出されます。"
      pt_BR: "Idioma em que o texto está escrito; detecta automaticamente."
    llm_description: "Source language code or auto (detect)."
    form: "llm"
  - name: "reasoning"
    type: "select"
    required: false
    default: "lowest"
    label:
      en_US: "Reasoning effort"
      zh_Hans: "推理强度"
      ja_JP: "推論の強さ"
      pt_BR: "Esforço de raciocínio"
    human_description:
      en_US: "Overrides the provider credential for this step only. lowest keeps the cheapest level the model supports; default leaves the request untouched."
      zh_Hans: "仅覆盖本次调用的推理强度。lowest 使用模型支持的最省档位；default 不发送推理参数。"
      ja_JP: "この呼び出しだけ推論の強さを上書きします。lowest はモデルが対応する最も軽いレベルを使い、default は推論パラメータを送信しません。"
      pt_BR: "Sobrepõe a credencial do provedor apenas nesta chamada. lowest usa o nível mais leve que o modelo suporta; default não envia parâmetro de raciocínio."
    llm_description: "Reasoning effort override: lowest, default, none, minimal, low, medium or high."
    form: "llm"
    options:
      - value: "lowest"
        label:
          en_US: "Lowest the model supports"
          zh_Hans: "模型支持的最省档位"
          ja_JP: "モデルが対応する最小"
          pt_BR: "O menor nível do modelo"
      - value: "default"
        label:
          en_US: "Provider default"
          zh_Hans: "供应商默认"
          ja_JP: "プロバイダーの既定"
          pt_BR: "Padrão do provedor"
      - value: "none"
        label:
          en_US: "None"
          zh_Hans: "无"
          ja_JP: "なし"
          pt_BR: "Nenhum"
      - value: "minimal"
        label:
          en_US: "Minimal"
          zh_Hans: "极简"
          ja_JP: "最小"
          pt_BR: "Mínimo"
      - value: "low"
        label:
          en_US: "Low"
          zh_Hans: "低"
          ja_JP: "低"
          pt_BR: "Baixo"
      - value: "medium"
        label:
          en_US: "Medium"
          zh_Hans: "中"
          ja_JP: "中"
          pt_BR: "Médio"
      - value: "high"
        label:
          en_US: "High"
          zh_Hans: "高"
          ja_JP: "高"
          pt_BR: "Alto"
extra:
  python:
    source: tools/dualtran.py
