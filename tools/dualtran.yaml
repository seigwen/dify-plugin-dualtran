identity:
  name: "dualtran"
  author: "seigwen"
  label:
    en_US: "DualTran Translate"
    zh_Hans: "DualTran 翻译"
description:
  human:
    en_US: "Translate text with Google or your own AI model (BYOK)."
    zh_Hans: "用 Google 或你自己的 AI 模型翻译文本（BYOK）。"
  llm: "Translate a text into a target language. Engines: Google (free) or the user's configured AI/DeepL provider (BYOK)."
parameters:
  - name: "text"
    type: "string"
    required: true
    label:
      en_US: "Text"
      zh_Hans: "文本"
    human_description:
      en_US: "The text to translate."
      zh_Hans: "需要翻译的文本。"
    llm_description: "The text to translate."
    form: "llm"
  - name: "target_lang"
    type: "string"
    required: true
    label:
      en_US: "Target language"
      zh_Hans: "目标语言"
    human_description:
      en_US: "Language code to translate into, e.g. en, zh-CN, ja."
      zh_Hans: "翻译目标语言代码，例如 en、zh-CN、ja。"
    llm_description: "Target language code (en, zh-CN, ja, …)."
    form: "llm"
  - name: "source_lang"
    type: "string"
    required: false
    label:
      en_US: "Source language"
      zh_Hans: "源语言"
    human_description:
      en_US: "Language the text is written in; auto detects it."
      zh_Hans: "文本的源语言；auto 表示自动检测。"
    llm_description: "Source language code or auto (detect)."
    form: "llm"
extra:
  python:
    source: tools/dualtran.py
